services:
  api-javascript:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-livros_db}
      POSTGRES_USER: ${POSTGRES_USER:-livros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livros_dev}
      # Por padrao, usa o MySQL local. O arquivo de integracao substitui
      # estes valores para acessar o banco mantido pela outra equipe.
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-livros_db}
      MYSQL_USER: ${MYSQL_USER:-livros}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-livros_dev}
      DB_CONNECT_TIMEOUT_MS: 3000
      HEALTH_TIMEOUT_MS: 1000
      REPLICATION_INTERVAL_MS: 5000
    ports:
      - "${API_JAVASCRIPT_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.status === 503 ? 1 : 0)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_LOCAL_DB:-livros_db}
      POSTGRES_USER: ${POSTGRES_LOCAL_USER:-livros}
      POSTGRES_PASSWORD: ${POSTGRES_LOCAL_PASSWORD:-livros_dev}
      TZ: UTC
    ports:
      - "${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOCAL_USER:-livros} -d ${POSTGRES_LOCAL_DB:-livros_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_LOCAL_DATABASE:-livros_db}
      MYSQL_USER: ${MYSQL_LOCAL_USER:-livros}
      MYSQL_PASSWORD: ${MYSQL_LOCAL_PASSWORD:-livros_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_LOCAL_ROOT_PASSWORD:-root_dev}
      TZ: UTC
    ports:
      - "${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_LOCAL_ROOT_PASSWORD:-root_dev} --silent"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
